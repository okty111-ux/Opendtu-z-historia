name: Kompilacja Fusion v2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [opendtufusionv2, opendtufusionv2_history]
    env:
      PLATFORMIO_BUILD_FLAGS: -DPV_BUILD_NUMBER=${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ github.sha }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Instalacja PlatformIO
        run: pip install --upgrade platformio intelhex

      - name: Rozpakowanie zip
        run: |
          ls -la *.zip || true
          for Z in $(ls *.zip 2>/dev/null | sort -V -r); do
            if unzip -tq "$Z" >/dev/null 2>&1; then
              echo "Uzywam: $Z"
              rm -rf _src && mkdir -p _src && unzip -q -o "$Z" -d _src
              break
            else
              echo "::warning::Uszkodzony plik pominiety: $Z"
            fi
          done

      - name: Szukanie projektu
        id: dir
        run: |
          P=$(find . -maxdepth 4 -name platformio.ini -not -path "*/.pio/*" | head -1)
          if [ -z "$P" ]; then echo "Nie znaleziono platformio.ini"; exit 1; fi
          echo "Projekt: $P"
          echo "dir=$(dirname "$P")" >> $GITHUB_OUTPUT

      - name: Budowanie panelu WWW
        working-directory: ${{ steps.dir.outputs.dir }}/webapp
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Kompilacja
        working-directory: ${{ steps.dir.outputs.dir }}
        run: pio run -e ${{ matrix.env }}

      - name: Przygotowanie plikow
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          mkdir -p wynik
          cp .pio/build/${{ matrix.env }}/firmware.bin wynik/opendtu-${{ matrix.env }}.bin
          cp .pio/build/${{ matrix.env }}/firmware.factory.bin wynik/opendtu-${{ matrix.env }}.factory.bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: opendtu-${{ matrix.env }}
          path: ${{ steps.dir.outputs.dir }}/wynik/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Opis wersji (build, sha256, size)
        working-directory: art
        run: |
          for f in opendtu-*.bin; do
            case "$f" in *.factory.bin) continue;; esac
            n="${f%.bin}"
            {
              echo "build=${{ github.run_number }}"
              echo "sha256=$(sha256sum "$f" | cut -d' ' -f1)"
              echo "size=$(stat -c%s "$f")"
              echo "date=$(date -u +%Y-%m-%dT%H:%MZ)"
            } > "$n.txt"
            cat "$n.txt"
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kompilacja #${{ github.run_number }}
          make_latest: "true"
          files: art/*
